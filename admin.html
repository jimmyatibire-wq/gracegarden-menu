<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grace Garden – Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0b1f3a; --navy-light: #132b4f; --navy-card: #1a3560;
      --gold: #d4a017; --gold-bright: #f0c040;
      --white: #f5f0e8; --text-muted: #a0b0c8;
      --danger: #e05555; --success: #3ecf8e;
    }
    body { background: var(--navy); color: var(--white); font-family: 'Lato', sans-serif; min-height: 100vh; padding-bottom: 60px; }
    header { background: linear-gradient(180deg, #060f1e 0%, var(--navy) 100%); padding: 22px 20px 18px; border-bottom: 1px solid rgba(212,160,23,0.3); display: flex; align-items: center; gap: 14px; }
    header img { width: 50px; border-radius: 50%; }
    header div h1 { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--white); }
    header div p { font-size: 0.72rem; color: var(--gold); letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; margin-top: 2px; }
    .header-right { margin-left: auto; }
    .header-right a { color: var(--text-muted); text-decoration: none; font-size: 0.82rem; }
    .header-right a:hover { color: var(--gold); }
    .container { max-width: 680px; margin: 0 auto; padding: 20px 16px; }
    .card { background: var(--navy-light); border: 1px solid rgba(255,255,255,0.07); border-radius: 16px; padding: 22px; margin-bottom: 22px; }
    .card h2 { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--gold-bright); margin-bottom: 16px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid .full { grid-column: 1 / -1; }
    label { display: block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px; }
    input { width: 100%; padding: 11px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--white); font-family: 'Lato', sans-serif; font-size: 0.92rem; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: var(--gold); }
    input::placeholder { color: rgba(160,176,200,0.5); }
    .btn-primary { width: 100%; margin-top: 14px; padding: 13px; background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 100%); color: #0b1f3a; border: none; border-radius: 10px; font-family: 'Lato', sans-serif; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(212,160,23,0.45); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-danger { background: transparent; border: 1px solid rgba(224,85,85,0.4); color: var(--danger); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-family: 'Lato', sans-serif; transition: background 0.15s; }
    .btn-danger:hover { background: rgba(224,85,85,0.15); }
    .btn-edit { background: transparent; border: 1px solid rgba(240,192,64,0.4); color: var(--gold-bright); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-family: 'Lato', sans-serif; transition: background 0.15s; margin-right: 6px; }
    .btn-edit:hover { background: rgba(240,192,64,0.1); }
    #toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 10px; font-weight: 700; font-size: 0.88rem; z-index: 999; transform: translateY(-80px); opacity: 0; transition: all 0.3s; pointer-events: none; max-width: 280px; text-align: center; }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { background: var(--success); color: #0b1f3a; }
    #toast.error   { background: var(--danger);  color: white; }
    #toast.info    { background: var(--gold);     color: #0b1f3a; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .tab { padding: 6px 14px; border-radius: 50px; border: 1px solid rgba(212,160,23,0.3); background: transparent; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; font-family: 'Lato', sans-serif; transition: all 0.15s; }
    .tab.active, .tab:hover { background: rgba(212,160,23,0.15); color: var(--gold-bright); border-color: var(--gold); }
    .item-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .item-row:last-child { border-bottom: none; }
    .item-info .item-name { font-size: 0.95rem; }
    .item-info .item-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .item-price { font-weight: 700; color: var(--gold-bright); margin-right: 10px; font-size: 0.95rem; white-space: nowrap; }
    .item-actions { display: flex; align-items: center; flex-shrink: 0; }
    .empty-list { text-align: center; padding: 30px; color: var(--text-muted); font-style: italic; font-size: 0.9rem; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 22px; }
    .stat-card { background: var(--navy-light); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 16px; text-align: center; }
    .stat-card .num { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--gold-bright); font-weight: 700; }
    .stat-card .label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
    .overlay.open { display: flex; }
    .modal { background: var(--navy-card); border: 1px solid rgba(212,160,23,0.3); border-radius: 18px; padding: 26px; width: 100%; max-width: 420px; }
    .modal h3 { font-family: 'Playfair Display', serif; color: var(--gold-bright); margin-bottom: 18px; }
    .modal-field { margin-bottom: 12px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
    .btn-secondary { flex: 1; padding: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--white); cursor: pointer; font-family: 'Lato', sans-serif; font-size: 0.9rem; }
    .btn-save { flex: 2; padding: 12px; background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 100%); border: none; border-radius: 10px; color: #0b1f3a; font-weight: 700; cursor: pointer; font-family: 'Lato', sans-serif; font-size: 0.9rem; }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-up, .btn-down { background: transparent; border: 1px solid rgba(160,176,200,0.25); color: var(--text-muted); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-family: 'Lato', sans-serif; transition: all 0.15s; margin-right: 3px; }
    .btn-up:hover, .btn-down:hover { border-color: rgba(212,160,23,0.5); color: var(--gold-bright); }
    .reorder-note { font-size: 0.73rem; color: var(--text-muted); margin-bottom: 10px; padding: 8px 12px; background: rgba(212,160,23,0.07); border-radius: 8px; border-left: 3px solid var(--gold); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <img src="logo.png" alt="Logo"/>
  <div>
    <h1>Admin Dashboard</h1>
    <p>Grace Garden Hotel</p>
  </div>
  <div class="header-right"><a href="index.html">← View Menu</a></div>
</header>

<div id="toast"></div>

<div class="overlay" id="editOverlay">
  <div class="modal">
    <h3>✏️ Edit Item</h3>
    <div class="modal-field"><label>Item Name</label><input id="editName" placeholder="e.g. Jollof Rice with Chicken"/></div>
    <div class="modal-field"><label>Price (GH₵)</label><input id="editPrice" type="number" placeholder="e.g. 50"/></div>
    <div class="modal-field"><label>Category</label><input id="editCategory" placeholder="e.g. Rice Dishes"/></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeEdit()">Cancel</button>
      <button class="btn-save" id="saveEditBtn" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="stats" id="stats"></div>
  <div class="card">
    <h2>➕ Add Menu Item</h2>
    <div class="form-grid">
      <div class="full"><label>Item Name</label><input id="addName" placeholder="e.g. Waakye with Fish"/></div>
      <div><label>Price (GH₵)</label><input id="addPrice" type="number" placeholder="e.g. 45"/></div>
      <div><label>Category</label><input id="addCategory" list="catList" placeholder="e.g. Local Dishes"/><datalist id="catList"></datalist></div>
    </div>
    <button class="btn-primary" id="addBtn" onclick="addItem()">Add to Menu</button>
  </div>
  <div class="card">
    <h2>📋 Current Menu</h2>
    <div class="tabs" id="tabs"></div>
    <div id="itemList"><div class="empty-list">Loading menu…</div></div>
  </div>
</div>

<script>
  const FB = "https://grace-garden-a30cc-default-rtdb.firebaseio.com";

  let menuItems    = [];   // array of { _key, name, price, category }
  let activeFilter = "All";
  let editingKey   = null;

  // ── Firebase helpers ──
  async function fbGet() {
    const res  = await fetch(`${FB}/menu.json`);
    if (!res.ok) throw new Error("Could not reach Firebase");
    const data = await res.json();
    return data
      ? Object.entries(data).map(([key, val]) => ({ _key: key, ...val }))
      : [];
  }

  async function fbPost(item) {
    // POST creates a new entry with a Firebase-generated key
    const res = await fetch(`${FB}/menu.json`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: item.name, price: item.price, category: item.category })
    });
    if (!res.ok) throw new Error("Add failed");
    return await res.json(); // { name: "<newKey>" }
  }

  async function fbPatch(key, item) {
    const res = await fetch(`${FB}/menu/${key}.json`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: item.name, price: item.price, category: item.category })
    });
    if (!res.ok) throw new Error("Update failed");
  }

  async function fbDelete(key) {
    const res = await fetch(`${FB}/menu/${key}.json`, { method: "DELETE" });
    if (!res.ok) throw new Error("Delete failed");
  }

  // ── Seed default menu if Firebase is empty ──
  async function seedIfEmpty() {
    const defaults = [
      { name: "Jollof Rice with Chicken",  price: 50, category: "Rice Dishes"  },
      { name: "Fried Rice with Chicken",   price: 50, category: "Rice Dishes"  },
      { name: "Banku with Tilapia",        price: 70, category: "Local Dishes" },
      { name: "Fufu with Light Soup",      price: 65, category: "Local Dishes" },
      { name: "Coca Cola",                 price: 10, category: "Drinks"       },
      { name: "Bottled Water",             price: 5,  category: "Drinks"       }
    ];
    for (const item of defaults) await fbPost(item);
  }

  // ── Toast ──
  function toast(msg, type = "success") {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "show " + type;
    setTimeout(() => { el.className = ""; }, 3200);
  }

  // ── Render ──
  function renderStats() {
    const cats = new Set(menuItems.map(i => i.category));
    const minPrice = menuItems.length ? Math.min(...menuItems.map(i => i.price)) : 0;
    document.getElementById("stats").innerHTML = `
      <div class="stat-card"><div class="num">${menuItems.length}</div><div class="label">Total Items</div></div>
      <div class="stat-card"><div class="num">${cats.size}</div><div class="label">Categories</div></div>
      <div class="stat-card"><div class="num">GH₵${minPrice}</div><div class="label">From</div></div>
    `;
  }

  function renderTabs() {
    const cats = ["All", ...new Set(menuItems.map(i => i.category))];
    document.getElementById("tabs").innerHTML = cats.map(c =>
      `<button class="tab ${c === activeFilter ? 'active' : ''}" onclick="setFilter('${c}')">${c}</button>`
    ).join("");
    const dl = document.getElementById("catList");
    dl.innerHTML = [...new Set(menuItems.map(i => i.category))].map(c => `<option value="${c}">`).join("");
  }

  function setFilter(cat) { activeFilter = cat; renderTabs(); renderList(); }

  function renderList() {
    const filtered = activeFilter === "All" ? menuItems : menuItems.filter(i => i.category === activeFilter);
    const el = document.getElementById("itemList");
    if (!filtered.length) { el.innerHTML = '<div class="empty-list">No items in this category yet.</div>'; return; }
    el.innerHTML = filtered.map(item => `
      <div class="item-row">
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-meta">${item.category}</div>
        </div>
        <div class="item-actions">
          <span class="item-price">GH₵${parseFloat(item.price).toFixed(2)}</span>
          <button class="btn-edit" onclick="openEdit('${item._key}')">Edit</button>
          <button class="btn-danger" onclick="deleteItem('${item._key}')">✕</button>
        </div>
      </div>
    `).join("");
  }

  function render() { renderStats(); renderTabs(); renderList(); }

  // ── Add ──
  async function addItem() {
    const name     = document.getElementById("addName").value.trim();
    const price    = parseFloat(document.getElementById("addPrice").value);
    const category = document.getElementById("addCategory").value.trim();
    if (!name)                     { toast("Please enter an item name.", "error"); return; }
    if (isNaN(price) || price < 0) { toast("Please enter a valid price.", "error"); return; }
    if (!category)                 { toast("Please enter a category.", "error"); return; }

    const btn = document.getElementById("addBtn");
    btn.disabled = true; btn.textContent = "Saving…";
    toast("Adding item…", "info");

    try {
      const result = await fbPost({ name, price, category });
      menuItems.push({ _key: result.name, name, price, category });
      document.getElementById("addName").value     = "";
      document.getElementById("addPrice").value    = "";
      document.getElementById("addCategory").value = "";
      toast(`"${name}" added! ✅`);
      render();
    } catch(e) {
      toast("Failed to add: " + e.message, "error");
    }
    btn.disabled = false; btn.textContent = "Add to Menu";
  }

  // ── Delete ──
  async function deleteItem(key) {
    const item = menuItems.find(i => i._key === key);
    if (!item || !confirm(`Delete "${item.name}"?`)) return;
    toast("Deleting…", "info");
    try {
      await fbDelete(key);
      menuItems = menuItems.filter(i => i._key !== key);
      toast(`"${item.name}" deleted.`);
      render();
    } catch(e) {
      toast("Failed to delete: " + e.message, "error");
    }
  }

  // ── Edit ──
  function openEdit(key) {
    const item = menuItems.find(i => i._key === key);
    if (!item) return;
    editingKey = key;
    document.getElementById("editName").value     = item.name;
    document.getElementById("editPrice").value    = item.price;
    document.getElementById("editCategory").value = item.category;
    document.getElementById("editOverlay").classList.add("open");
  }

  function closeEdit() {
    editingKey = null;
    document.getElementById("editOverlay").classList.remove("open");
  }

  async function saveEdit() {
    const name     = document.getElementById("editName").value.trim();
    const price    = parseFloat(document.getElementById("editPrice").value);
    const category = document.getElementById("editCategory").value.trim();
    if (!name || isNaN(price) || !category) { toast("Please fill all fields.", "error"); return; }

    const btn = document.getElementById("saveEditBtn");
    btn.disabled = true; btn.textContent = "Saving…";

    try {
      await fbPatch(editingKey, { name, price, category });
      const idx = menuItems.findIndex(i => i._key === editingKey);
      if (idx > -1) menuItems[idx] = { ...menuItems[idx], name, price, category };
      toast(`"${name}" updated! ✅`);
      closeEdit();
      render();
    } catch(e) {
      toast("Failed to update: " + e.message, "error");
    }
    btn.disabled = false; btn.textContent = "Save Changes";
  }

  document.getElementById("editOverlay").addEventListener("click", function(e) {
    if (e.target === this) closeEdit();
  });

  // ── Reorder ──
  async function moveItem(id, direction) {
    // Get items in current filtered view
    const filtered = activeFilter === "All" ? menuItems : menuItems.filter(i => i.category === activeFilter);
    const idx = filtered.findIndex(i => i.id === id);
    const swapIdx = idx + direction;
    if (swapIdx < 0 || swapIdx >= filtered.length) return;

    const itemA = filtered[idx];
    const itemB = filtered[swapIdx];

    // Swap their positions in menuItems array
    const globalIdxA = menuItems.findIndex(i => i.id === itemA.id);
    const globalIdxB = menuItems.findIndex(i => i.id === itemB.id);
    [menuItems[globalIdxA], menuItems[globalIdxB]] = [menuItems[globalIdxB], menuItems[globalIdxA]];

    toast("Saving order…", "info");
    try {
      await saveMenu(menuItems);
      toast("Order updated! ✅");
      render();
    } catch(e) {
      toast("Failed to save order.", "error");
    }
  }

  // ── Init ──
  (async () => {
    try {
      menuItems = await fbGet();
      if (menuItems.length === 0) {
        toast("Setting up menu for first time…", "info");
        await seedIfEmpty();
        menuItems = await fbGet();
      }
      render();
    } catch(e) {
      document.getElementById("itemList").innerHTML =
        '<div class="empty-list">Could not connect to database. Check your internet connection.</div>';
      toast("Connection failed.", "error");
    }
  })();
</script>
</body>
</html>
