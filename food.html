<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grace Garden Hotel – Food Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--navy:#0b1f3a;--navy-light:#132b4f;--gold:#d4a017;--gold-bright:#f0c040;--white:#f5f0e8;--text-muted:#a0b0c8;}
    body{background:var(--navy);color:var(--white);font-family:"Lato",sans-serif;min-height:100vh;padding-bottom:100px;}
    header{background:linear-gradient(180deg,#060f1e 0%,var(--navy) 100%);text-align:center;padding:22px 20px 18px;border-bottom:1px solid rgba(212,160,23,0.3);position:relative;}
    header::after{content:"";display:block;width:60px;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:10px auto 0;}
    header img{width:70px;border-radius:50%;margin-bottom:8px;filter:drop-shadow(0 4px 16px rgba(212,160,23,0.4));}
    header h1{font-family:"Playfair Display",serif;font-size:1.3rem;font-weight:900;letter-spacing:0.04em;color:var(--white);}
    header p{font-size:0.68rem;color:var(--gold);letter-spacing:0.18em;text-transform:uppercase;margin-top:3px;font-weight:700;}
    .back-btn{position:absolute;top:18px;left:16px;color:var(--text-muted);font-size:0.8rem;text-decoration:none;display:flex;align-items:center;gap:4px;}
    .back-btn:hover{color:var(--gold);}
    .survey-btn-wrap{padding:12px 16px 0;}
    .survey-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;background:linear-gradient(135deg,var(--gold) 0%,var(--gold-bright) 100%);color:#0b1f3a;border-radius:12px;text-decoration:none;font-weight:700;font-size:0.85rem;letter-spacing:0.03em;box-shadow:0 4px 16px rgba(212,160,23,0.3);transition:transform 0.15s;}
    .survey-btn:hover{transform:translateY(-2px);}
    .search-wrap{padding:12px 16px 6px;}
    .search-wrap input{width:100%;padding:11px 18px;background:rgba(255,255,255,0.06);border:1px solid rgba(212,160,23,0.35);border-radius:50px;color:var(--white);font-family:"Lato",sans-serif;font-size:0.92rem;outline:none;transition:border-color 0.2s;}
    .search-wrap input::placeholder{color:var(--text-muted);}
    .search-wrap input:focus{border-color:var(--gold);}
    #menu{padding:6px 0 20px;}
    .category-block{margin:16px 14px 4px;}
    .category-title{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
    .category-title h3{font-family:"Playfair Display",serif;font-size:1rem;color:var(--gold-bright);font-weight:700;white-space:nowrap;}
    .category-title::after{content:"";flex:1;height:1px;background:rgba(212,160,23,0.2);}
    .item{background:var(--navy-light);border:1px solid rgba(255,255,255,0.06);border-radius:14px;margin-bottom:9px;overflow:hidden;transition:border-color 0.2s;}
    .item:hover{border-color:rgba(212,160,23,0.3);}
    .item-main{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
    .item-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;}
    .item-name{font-size:0.95rem;color:var(--white);text-align:left;}
    .item-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .item-price{font-weight:700;font-size:0.98rem;color:var(--gold-bright);white-space:nowrap;}
    .extras-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(212,160,23,0.12);border:1px solid rgba(212,160,23,0.3);color:var(--gold);font-size:0.62rem;font-weight:700;padding:3px 8px;border-radius:20px;cursor:pointer;white-space:nowrap;letter-spacing:0.04em;text-transform:uppercase;transition:all 0.15s;user-select:none;flex-shrink:0;}
    .extras-badge:hover{background:rgba(212,160,23,0.2);border-color:var(--gold);}
    .extras-badge .chevron{font-size:0.6rem;transition:transform 0.2s;display:inline-block;}
    .item.open .extras-badge .chevron{transform:rotate(90deg);}
    .extras-panel{display:none;border-top:1px solid rgba(255,255,255,0.06);padding:10px 16px 13px;background:rgba(0,0,0,0.12);}
    .item.open .extras-panel{display:block;}
    .extras-label{font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-bottom:7px;}
    .extra-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
    .extra-row:last-child{border-bottom:none;}
    .extra-dot{width:5px;height:5px;background:var(--gold);border-radius:50%;flex-shrink:0;opacity:0.7;}
    .extra-name{font-size:0.86rem;color:rgba(245,240,232,0.85);text-align:left;}
    #empty{display:none;text-align:center;padding:50px 20px;color:var(--text-muted);font-style:italic;}
    .loading{text-align:center;padding:50px 20px;color:var(--text-muted);}
    .loading span{display:inline-block;animation:pulse 1.2s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
    .floating{position:fixed;right:14px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:100;}
    .float-btn{display:block;background:linear-gradient(135deg,var(--gold) 0%,var(--gold-bright) 100%);color:#0b1f3a;padding:12px 16px;border-radius:50px;text-decoration:none;font-weight:700;font-size:0.82rem;text-align:center;box-shadow:0 4px 18px rgba(212,160,23,0.45);transition:transform 0.15s;}
    .float-btn:hover{transform:translateY(-2px);}
    .admin-link{text-align:center;padding:8px;font-size:0.72rem;}
    .admin-link a{color:rgba(212,160,23,0.35);text-decoration:none;margin:0 6px;}
    .admin-link a:hover{color:var(--gold);}
  </style>
</head>
<body>
<header>
  <a class="back-btn" href="index.html">← Back</a>
  <img src="logo.png" alt="Grace Garden Hotel Logo"/>
  <h1>Grace Garden Hotel</h1>
  <p>Food Menu</p>
</header>

<div class="survey-btn-wrap">
  <a class="survey-btn" href="https://forms.gle/fqnFBw7apWGBoQyf9" target="_blank">⭐ Rate Your Experience — Take Our Survey</a>
</div>

<div class="search-wrap">
  <input type="search" id="searchInput" placeholder="🔍  Search food items…" oninput="filterMenu(this.value)"/>
</div>

<div id="menu"><div class="loading"><span>Loading menu…</span></div></div>
<div id="empty">No items found.</div>

<div class="floating">
  <a class="float-btn" href="https://wa.me/233249320157">💬 WhatsApp</a>
  <a class="float-btn" href="tel:+233249320157">📞 Call Waiter</a>
</div>
<div class="admin-link">
  <a href="index.html">← Back</a>
  <a href="admin.html"></a>
</div>

<script>
  const FB = "https://grace-garden-a30cc-default-rtdb.firebaseio.com";
  const MENU_TYPE = "food"; // "food" or "beverage"

  // Categories that belong to each type
  const FOOD_CATS = ["rice dishes","local dishes","grills","continental","soups","starters","breakfast","snacks","desserts","main course","sides"];
  const BEV_CATS  = ["drinks","beverages","hot beverages","juice","cocktails","water","soft drinks","alcohol","beer","wine","spirits","smoothies"];

  function isMyType(category) {
    const c = (category || "").toLowerCase();
    if (MENU_TYPE === "food") {
      // If explicitly marked as food type, or category matches food list, or NOT in beverage list
      return !BEV_CATS.some(b => c.includes(b));
    } else {
      return BEV_CATS.some(b => c.includes(b));
    }
  }

  let allItems = [];

  async function loadMenu() {
    try {
      const res  = await fetch(`${FB}/menu.json`);
      const data = await res.json();
      const raw  = data ? Object.entries(data).map(([key, val]) => ({ _key: key, ...val })).sort((a,b) => (a.id||0) - (b.id||0)) : [];
      // Filter by type — use explicit "type" field if set, otherwise use category name
      allItems = raw.filter(item => {
        if (item.type) return item.type === MENU_TYPE;
        return isMyType(item.category);
      });
      renderMenu(allItems);
    } catch(e) {
      document.getElementById("menu").innerHTML = "<div class=\"loading\"><span>Could not load menu. Check your connection.</span></div>";
    }
  }

  function renderMenu(items) {
    const container = document.getElementById("menu");
    const empty     = document.getElementById("empty");
    container.innerHTML = "";
    if (!items.length) { empty.style.display = "block"; return; }
    empty.style.display = "none";
    const grouped = {};
    items.forEach(item => {
      if (!grouped[item.category]) grouped[item.category] = [];
      grouped[item.category].push(item);
    });
    for (const cat in grouped) {
      const block = document.createElement("div");
      block.className = "category-block";
      block.innerHTML = `<div class="category-title"><h3>${cat}</h3></div>`;
      grouped[cat].forEach(item => {
        const hasExtras = item.extras && item.extras.length > 0;
        const div = document.createElement("div");
        div.className = "item";
        if (hasExtras) {
          const extrasHTML = item.extras.map(e =>
            `<div class="extra-row"><span class="extra-dot"></span><span class="extra-name">${e.name}</span></div>`
          ).join("");
          div.innerHTML = `
            <div class="item-main">
              <div class="item-left">
                <span class="item-name">${item.name}</span>
                <span class="extras-badge" onclick="toggleExtras(this)">Options <span class="chevron">›</span></span>
              </div>
              <div class="item-right"><span class="item-price">GH₵${parseFloat(item.price).toFixed(2)}</span></div>
            </div>
            <div class="extras-panel">
              <div class="extras-label">Add-ons &amp; Options</div>
              ${extrasHTML}
            </div>`;
        } else {
          div.innerHTML = `
            <div class="item-main">
              <div class="item-left"><span class="item-name">${item.name}</span></div>
              <div class="item-right"><span class="item-price">GH₵${parseFloat(item.price).toFixed(2)}</span></div>
            </div>`;
        }
        block.appendChild(div);
      });
      container.appendChild(block);
    }
  }

  function toggleExtras(badge) { badge.closest(".item").classList.toggle("open"); }

  function filterMenu(query) {
    if (!query.trim()) { renderMenu(allItems); return; }
    const q = query.toLowerCase();
    renderMenu(allItems.filter(i => i.name.toLowerCase().includes(q) || i.category.toLowerCase().includes(q)));
  }

  loadMenu();
</script>
</body>
</html>
