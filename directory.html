<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grace Garden Hotel – Guest Directory</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --navy:#0b1f3a;--navy2:#0f2848;--navy3:#132b4f;
      --gold:#d4a017;--gold2:#f0c040;
      --cream:#f5f0e8;--muted:#a0b0c8;
    }
    body{background:var(--navy);color:var(--cream);font-family:'Lato',sans-serif;min-height:100vh;padding-bottom:80px;}

    header{
      background:linear-gradient(180deg,#060f1e 0%,var(--navy) 100%);
      padding:22px 18px 18px;
      border-bottom:1px solid rgba(212,160,23,0.25);
      display:flex;align-items:center;gap:12px;
      position:sticky;top:0;z-index:50;
      backdrop-filter:blur(10px);
    }
    header img{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(212,160,23,0.5);}
    .header-text h1{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:600;color:var(--cream);}
    .header-text p{font-size:0.65rem;color:var(--gold);letter-spacing:0.18em;text-transform:uppercase;font-weight:700;}
    .back-btn{margin-left:auto;font-size:0.78rem;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:4px;}
    .back-btn:hover{color:var(--gold);}

    .hero{
      background:linear-gradient(135deg,rgba(212,160,23,0.08) 0%,transparent 50%);
      padding:28px 18px 22px;
      border-bottom:1px solid rgba(212,160,23,0.1);
      text-align:center;
    }
    .hero h2{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700;color:var(--gold2);letter-spacing:0.05em;}
    .hero p{font-size:0.78rem;color:var(--muted);margin-top:4px;letter-spacing:0.06em;}

    /* category tabs */
    .tabs-wrap{overflow-x:auto;padding:14px 18px 0;scrollbar-width:none;}
    .tabs-wrap::-webkit-scrollbar{display:none;}
    .tabs{display:flex;gap:8px;min-width:max-content;padding-bottom:14px;}
    .tab{padding:6px 14px;border-radius:50px;border:1px solid rgba(212,160,23,0.3);background:transparent;color:var(--muted);font-size:0.75rem;cursor:pointer;font-family:'Lato',sans-serif;transition:all 0.15s;white-space:nowrap;}
    .tab.active,.tab:hover{background:rgba(212,160,23,0.15);color:var(--gold2);border-color:var(--gold);}

    .sections{padding:8px 0 20px;}

    /* section card */
    .section-card{
      margin:10px 14px;
      background:var(--navy3);
      border:1px solid rgba(255,255,255,0.06);
      border-radius:14px;
      overflow:hidden;
      transition:border-color 0.2s;
    }
    .section-card:hover{border-color:rgba(212,160,23,0.2);}

    .section-head{
      display:flex;align-items:center;gap:12px;
      padding:14px 16px;
      cursor:pointer;
      user-select:none;
    }
    .section-icon{
      width:38px;height:38px;border-radius:10px;flex-shrink:0;
      background:rgba(212,160,23,0.1);border:1px solid rgba(212,160,23,0.2);
      display:flex;align-items:center;justify-content:center;font-size:1rem;
    }
    .section-title{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;color:var(--cream);flex:1;}
    .section-chevron{color:var(--gold);font-size:1rem;transition:transform 0.2s;flex-shrink:0;}
    .section-card.open .section-chevron{transform:rotate(90deg);}

    .section-body{
      display:none;
      padding:0 16px 16px;
      border-top:1px solid rgba(255,255,255,0.05);
    }
    .section-card.open .section-body{display:block;}

    .section-content{
      font-size:0.88rem;line-height:1.75;color:rgba(245,240,232,0.85);
      padding-top:12px;
      white-space:pre-wrap;
    }
    .section-content strong,.section-content b{color:var(--gold2);}

    /* loading */
    .loading{text-align:center;padding:60px 20px;color:var(--muted);}
    .pulse{display:inline-block;animation:pulse 1.2s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}

    /* floating buttons */
    .floating{position:fixed;right:14px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:100;}
    .float-btn{
      display:block;background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);
      color:#0b1f3a;padding:12px 16px;border-radius:50px;
      text-decoration:none;font-weight:700;font-size:0.8rem;
      text-align:center;box-shadow:0 4px 18px rgba(212,160,23,0.4);
      transition:transform 0.15s;
    }
    .float-btn:hover{transform:translateY(-2px);}

    .staff-link{text-align:center;padding:8px;font-size:0.72rem;}
    .staff-link a{color:rgba(212,160,23,0.35);text-decoration:none;}
    .staff-link a:hover{color:var(--gold);}
  </style>
</head>
<body>

<header>
  <img src="logo.png" alt="Logo" onerror="this.style.display='none'"/>
  <div class="header-text">
    <h1>Grace Garden Hotel</h1>
    <p>Guest Directory</p>
  </div>
  <a class="back-btn" href="hub.html">← Back</a>
</header>

<div class="hero">
  <h2>Guest Directory</h2>
  <p>Everything you need during your stay</p>
</div>

<div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>

<div class="sections" id="sections">
  <div class="loading"><span class="pulse">Loading directory…</span></div>
</div>

<div class="floating">
  <a class="float-btn" href="tel:+233249320157">📞 Reception</a>
  <a class="float-btn" href="https://wa.me/233249320157">💬 WhatsApp</a>
</div>
<div class="staff-link"><a href="directory-admin.html">staff</a></div>

<script>
const FB = "https://grace-garden-a30cc-default-rtdb.firebaseio.com";
const DEFAULT_SECTIONS = [
  { id:1, category:"Room Services", icon:"🛎️", title:"Room Service", content:"Grace Garden Hotel Room Service is pleased to serve you daily from 7:00 AM until 10:00 PM.\n\nTo place your order, kindly dial extension 0." },
  { id:2, category:"Room Services", icon:"🔒", title:"Safe", content:"For your peace of mind, a complimentary electronic safe is provided in your room.\n\nWe kindly recommend storing your valuables in the safe during your stay." },
  { id:3, category:"Room Services", icon:"⏰", title:"Wake Up Calls", content:"To request a wake-up call, kindly contact Reception.\n\nWe are pleased to assist you at your convenience." },
  { id:4, category:"Room Services", icon:"📺", title:"Television Channels", content:"Your room is equipped with DSTV, Netflix, and other digital entertainment options for your enjoyment.\n\nShould you realise you have forgotten any item during your stay, kindly contact Reception at your convenience." },
  { id:5, category:"Room Services", icon:"☕", title:"Coffee / Tea Maker", content:"A complimentary coffee and tea maker with initial supplies is provided in your room.\n\nAdditional provisions may be requested from Reception." },
  { id:6, category:"Room Services", icon:"🛁", title:"Bathrobes", content:"Complimentary bathrobes are available for the duration of your stay.\n\nPlease contact Reception to request one; it will be delivered promptly to your room." },
  { id:7, category:"Facilities", icon:"🌐", title:"High Speed Internet", content:"Complimentary wireless internet access is available throughout the property.\n\nFor help or support, simply contact Reception." },
  { id:8, category:"Facilities", icon:"🏊", title:"Terrace Pool Bar & Lounge", content:"Open daily, 8:00 a.m. to 10:00 p.m.\n\nRefreshing beverages, light and heavy meals, and refreshments served." },
  { id:9, category:"Facilities", icon:"🏋️", title:"Recreational Facilities", content:"The Hotel's gymnasium and swimming pool are graciously placed at your disposal for relaxation and well-being.\n\nThese facilities close daily at 6:00 p.m. for the safety and comfort of all guests.\n\nShould you wish to make use of them after this time, kindly inform Reception at least one hour in advance so that suitable arrangements may be made.\n\nChildren under the age of 16 must be accompanied by an adult at all times or obtain prior permission from Reception before using these facilities.\n\nPlease note that the Grace Garden Hotel cannot accept responsibility for any incidents arising from non-compliance with these guidelines." },
  { id:10, category:"Facilities", icon:"🍽️", title:"Dining", content:"The Grace Garden Restaurants, situated on the lobby floor adjacent to the Bar & Lounge, invites you to savour refined cuisine in an elegant setting.\n\nOperating Hours:\n• Breakfast — 6:00 a.m. to 10:00 a.m.\n• Lunch — 12:00 noon to 3:30 p.m.\n• Dinner — 4:30 p.m. to 10:00 p.m.\n\nOur dedicated team looks forward to welcoming you and ensuring your dining experience is one of comfort and delight.\n\nShould you require room service, special dietary arrangements, or any assistance, please contact Reception at any time." },
  { id:11, category:"Services", icon:"👔", title:"Dry Cleaning & Laundry", content:"Laundry, dry cleaning & pressing services are available.\n\nContact Reception to arrange.\n\n• Standard turnaround: back in your room by 11:00 the next morning.\n• Express service: same-day delivery (on request)." },
  { id:12, category:"Services", icon:"🧳", title:"Luggage Assistance & Storage", content:"Should you require assistance with luggage, kindly contact Reception.\n\nOur team will be pleased to provide porter service or any other support you may need." },
  { id:13, category:"Services", icon:"🏢", title:"Meeting Room", content:"Conference/Executive Meeting Room available.\n\nCapacity: up to 50 people (flexible arrangements).\n\nContact Reception for booking, details & availability." },
  { id:14, category:"Services", icon:"🧴", title:"Services & Toiletries", content:"Extra toiletries, towels, blankets & more available on request.\n\nSimply contact Reception — we're here to help." },
  { id:15, category:"Payments & Tech", icon:"💳", title:"Electronic Payments", content:"We make payments easy and secure.\n\nWe accept:\n• Visa Card\n• MasterCard\n• MTN Mobile Money (Merchant Code: 536353)" },
  { id:16, category:"Payments & Tech", icon:"🔌", title:"Electricity", content:"Rooms are equipped with 220/240-volt outlets available at all times.\n\nPlug adaptors are provided free of charge upon request to Reception." },
  { id:17, category:"Payments & Tech", icon:"📞", title:"Dialling Instructions", content:"• Room to Room: Dial the room number directly\n• Reception: Dial 0\n• Bar or Restaurant: Dial 412" },
  { id:18, category:"Breakfast", icon:"🌅", title:"Breakfast", content:"Start your day deliciously!\n\nBreakfast is served daily in the hotel restaurant from 6:00 a.m. to 10:00 a.m.\n\nIn-room service is available upon request during these hours.\n\nPlease contact Reception to arrange." },
  { id:19, category:"Emergency", icon:"🚨", title:"Emergency Procedures", content:"IN THE EVENT OF ANY EMERGENCY:\nDial 0 immediately from your room phone to contact Reception.\nOur team is on duty 24 hours to assist.\n\nFIRE SAFETY:\n• Stay calm.\n• Evacuate using the nearest emergency stairway.\n• Proceed to the designated Emergency Assembly Point shown on the floor plan.\n\nIf unable to leave your room, close the door, seal gaps with towels if possible, and call Reception on 0 to report your location.\n\nYour safety is our highest priority." }
];

let sections = [];
let activeFilter = "All";

async function loadSections() {
  try {
    const res = await fetch(`${FB}/directory.json`);
    const data = await res.json();
    if (data) {
      sections = Object.entries(data).map(([key, val]) => ({ _key: key, ...val }));
      sections.sort((a,b) => (a.id||0) - (b.id||0));
    } else {
      await seedDefaults();
    }
    render();
  } catch(e) {
    document.getElementById("sections").innerHTML = '<div class="loading"><span>Could not load directory. Check your connection.</span></div>';
  }
}

async function seedDefaults() {
  for (const s of DEFAULT_SECTIONS) {
    const res = await fetch(`${FB}/directory.json`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(s)
    });
  }
  const res2 = await fetch(`${FB}/directory.json`);
  const data = await res2.json();
  sections = Object.entries(data).map(([key, val]) => ({ _key: key, ...val }));
  sections.sort((a,b) => (a.id||0) - (b.id||0));
}

function getCategories() {
  return ["All", ...new Set(sections.map(s => s.category))];
}

function renderTabs() {
  const cats = getCategories();
  document.getElementById("tabs").innerHTML = cats.map(c =>
    `<button class="tab ${c===activeFilter?'active':''}" onclick="setFilter('${c}')">${c}</button>`
  ).join("");
}

function setFilter(cat) { activeFilter = cat; renderTabs(); renderList(); }

function renderList() {
  const filtered = activeFilter === "All" ? sections : sections.filter(s => s.category === activeFilter);
  const el = document.getElementById("sections");
  if (!filtered.length) { el.innerHTML = '<div class="loading">No items found.</div>'; return; }
  el.innerHTML = filtered.map(s => `
    <div class="section-card" id="card-${s._key}">
      <div class="section-head" onclick="toggleCard('${s._key}')">
        <div class="section-icon">${s.icon || '📌'}</div>
        <div class="section-title">${s.title}</div>
        <div class="section-chevron">›</div>
      </div>
      <div class="section-body">
        <div class="section-content">${escHtml(s.content || '')}</div>
      </div>
    </div>
  `).join("");
}

function toggleCard(key) {
  const card = document.getElementById("card-"+key);
  card.classList.toggle("open");
}

function escHtml(t) {
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function render() { renderTabs(); renderList(); }
loadSections();
</script>
</body>
</html>
