<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grace Garden Hotel</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --navy:#0b1f3a;--navy2:#0f2848;--navy3:#132b4f;
      --gold:#d4a017;--gold2:#f0c040;
      --cream:#f5f0e8;--muted:#a0b0c8;
    }
    body{
      background:var(--navy);
      font-family:'Lato',sans-serif;
      color:var(--cream);
      min-height:100vh;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:24px 20px;
      position:relative;
      overflow-x:hidden;
    }

    /* subtle background glow */
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(212,160,23,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(212,160,23,0.05) 0%, transparent 55%);
      z-index:0;
    }

    .wrap{
      position:relative;z-index:1;
      display:flex;flex-direction:column;
      align-items:center;
      width:100%;max-width:400px;
    }

    .logo-ring{
      width:92px;height:92px;border-radius:50%;
      border:2.5px solid rgba(212,160,23,0.5);
      overflow:hidden;margin-bottom:14px;
      box-shadow:0 0 32px rgba(212,160,23,0.18);
      flex-shrink:0;
    }
    .logo-ring img{width:100%;height:100%;object-fit:cover;display:block;}

    .eyebrow{
      font-size:0.62rem;letter-spacing:0.28em;text-transform:uppercase;
      color:var(--gold);font-weight:700;margin-bottom:5px;text-align:center;
    }
    h1{
      font-family:'Cormorant Garamond',serif;
      font-size:2rem;font-weight:700;
      color:var(--cream);text-align:center;line-height:1.18;
      letter-spacing:0.03em;margin-bottom:3px;
    }
    .sub{
      font-size:0.68rem;color:var(--muted);letter-spacing:0.12em;
      text-transform:uppercase;margin-bottom:24px;text-align:center;
    }

    .divider{
      width:100%;display:flex;align-items:center;gap:10px;margin-bottom:24px;
    }
    .divider span{flex:1;height:0.5px;background:linear-gradient(90deg,transparent,rgba(212,160,23,0.4),transparent);}
    .divider i{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);flex-shrink:0;}

    .cards{width:100%;display:flex;flex-direction:column;gap:12px;}

    .card{
      width:100%;
      background:rgba(255,255,255,0.035);
      border:1px solid rgba(212,160,23,0.2);
      border-radius:16px;padding:18px 20px;
      text-decoration:none;
      display:flex;align-items:center;gap:14px;
      transition:all 0.22s;
      position:relative;overflow:hidden;
    }
    .card::after{
      content:'';position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(212,160,23,0.07) 0%,transparent 60%);
      opacity:0;transition:opacity 0.22s;
    }
    .card:hover{transform:translateY(-2px);border-color:rgba(212,160,23,0.5);box-shadow:0 8px 28px rgba(0,0,0,0.28);}
    .card:hover::after{opacity:1;}

    .card-icon{
      width:50px;height:50px;border-radius:13px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      background:rgba(212,160,23,0.1);
      border:1px solid rgba(212,160,23,0.22);
      position:relative;z-index:1;
    }
    .card-icon svg{width:24px;height:24px;stroke:var(--gold2);fill:none;stroke-width:1.5;}

    .card-body{flex:1;position:relative;z-index:1;}
    .card-title{
      font-family:'Cormorant Garamond',serif;
      font-size:1.15rem;font-weight:700;color:var(--cream);
      letter-spacing:0.02em;margin-bottom:2px;
    }
    .card-desc{font-size:0.73rem;color:var(--muted);line-height:1.45;}

    .arrow{color:var(--gold);font-size:1.3rem;flex-shrink:0;position:relative;z-index:1;transition:transform 0.2s;}
    .card:hover .arrow{transform:translateX(4px);}

    .footer{
      margin-top:26px;font-size:0.63rem;
      color:rgba(160,176,200,0.45);
      letter-spacing:0.1em;text-transform:uppercase;text-align:center;
    }
    .footer a{color:rgba(212,160,23,0.4);text-decoration:none;}
    .footer a:hover{color:var(--gold);}
  </style>
</head>
